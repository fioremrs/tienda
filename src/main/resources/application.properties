#Clase 1
spring.application.name=tienda
#Para definir el puerto donde "escuchará" el servidor
server.port=8080

#Clase 2
#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformart=hh:mm

#Para eliminar mensajes invasivos de Sprint
sprint.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en produccion "true"
sprint.thymeleaf.cache=false

#Clase 3
#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop
 
#Usuario y clave de creaTablas en MySQL
spring.datasource.username=root
spring.datasource.password=root
 
#Driver y plataformas de comunicación 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
#Mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE